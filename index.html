<body>

    <header class="topbar">
        <span class="logo">Тарта&#769н</span>
        <div class="mode-tabs">
            <button class="mode-tab active" data-mode="pattern">Узор</button>
            <button class="mode-tab" data-mode="wallpaper">Обои</button>
        </div>
        <div class="topbar-spacer"></div>
        <button class="btn-dl-top" id="downloadBtn">Скачать PNG</button>
    </header>

    <main class="main">

        <aside class="sidebar">

            <div class="ctrl-label">Цвет</div>
            <div class="ctrl-row">
                <select id="dominant">
                    <option value="any">Случайный</option>
                    <option value="B">Синий</option>
                    <option value="G">Зелёный</option>
                    <option value="K">Чёрный</option>
                    <option value="R">Красный</option>
                    <option value="T">Коричневый</option>
                    <option value="P">Фиолетовый</option>
                    <option value="Y">Жёлтый</option>
                    <option value="N">Серый</option>
                    <option value="W">Белый</option>
                    <option value="C">Малиновый</option>
                    <option value="M">Пурпурный</option>
                    <option value="E">Бирюзовый</option>
                    <option value="I">Индиго</option>
                    <option value="S">Сланцевый</option>
                </select>
                <div class="color-dot" id="colorDot"></div>
            </div>

            <div class="ctrl-label">Тон</div>
            <select id="tone">
                <option value="any">Любой</option>
                <option value="dark">Тёмный</option>
                <option value="light">Светлый</option>
                <option value="historical">Исторический</option>
                <option value="modern">Современный</option>
            </select>

            <div class="ctrl-label">Ткань</div>
            <label class="ctrl-check"><input type="checkbox" id="texture" checked> Са&#769ржа 2/2</label>
            <label class="ctrl-check"><input type="checkbox" id="warpweft"> Разные цвета основы и утки&#769</label>
            <div class="ctrl-slider" style="margin-top:6px">
                <span class="slider-name">Плотность</span>
                <input type="range" id="density" min="0.5" max="5" step="0.5" value="1">
                <span class="slider-val" id="densityLabel">1x</span>
            </div>

            <div class="ctrl-divider"></div>

            <div id="patternControls">
                <div class="ctrl-label">Thread count</div>
                <textarea id="tcInput" rows="2" placeholder="G/24 B4 K24 B4 G/24"></textarea>
                <div class="tc-error" id="tcError">Ошибка разбора. Пример: G/24 B4 K24</div>
                <button class="btn-sm" id="applyTC">Применить</button>
                <div class="tc-hint">B G K R T P Y N W O C M E I S · D/L — префиксы · / — якорь</div>
            </div>

            <div id="wallpaperControls" style="display:none">
                <div class="ctrl-label">Устройство</div>

                <div class="preset-group-label">PC</div>
                <div class="preset-grid">
                    <button class="preset-btn active" data-w="1920" data-h="1080">
                        <span class="pn">Full HD</span><span class="ps">1920 × 1080</span>
                    </button>
                    <button class="preset-btn" data-w="1920" data-h="1200">
                        <span class="pn">WUXGA</span><span class="ps">1920 × 1200</span>
                    </button>
                    <button class="preset-btn" data-w="2560" data-h="1440">
                        <span class="pn">QHD</span><span class="ps">2560 × 1440</span>
                    </button>
                    <button class="preset-btn" data-w="3840" data-h="2160">
                        <span class="pn">4K UHD</span><span class="ps">3840 × 2160</span>
                    </button>
                    <button class="preset-btn" data-w="3440" data-h="1440">
                        <span class="pn">Ultrawide</span><span class="ps">3440 × 1440</span>
                    </button>
                    <button class="preset-btn" data-w="2560" data-h="1080">
                        <span class="pn">UW Full HD</span><span class="ps">2560 × 1080</span>
                    </button>
                    <button class="preset-btn" data-w="1366" data-h="768">
                        <span class="pn">HD Laptop</span><span class="ps">1366 × 768</span>
                    </button>
                </div>

                <div class="preset-group-label">Android</div>
                <div class="preset-grid">
                    <button class="preset-btn" data-w="1080" data-h="2400">
                        <span class="pn">Standard</span><span class="ps">1080 × 2400</span>
                    </button>
                    <button class="preset-btn" data-w="1440" data-h="3200">
                        <span class="pn">QHD</span><span class="ps">1440 × 3200</span>
                    </button>
                    <button class="preset-btn" data-w="1080" data-h="2340">
                        <span class="pn">Pixel / Samsung</span><span class="ps">1080 × 2340</span>
                    </button>
                    <button class="preset-btn" data-w="720" data-h="1600">
                        <span class="pn">Budget</span><span class="ps">720 × 1600</span>
                    </button>
                </div>

                <div class="preset-group-label">iOS</div>
                <div class="preset-grid">
                    <button class="preset-btn" data-w="1179" data-h="2556">
                        <span class="pn">iPhone 15 / 16</span><span class="ps">1179 × 2556</span>
                    </button>
                    <button class="preset-btn" data-w="1290" data-h="2796">
                        <span class="pn">Pro Max</span><span class="ps">1290 × 2796</span>
                    </button>
                    <button class="preset-btn" data-w="1170" data-h="2532">
                        <span class="pn">14 / 13 Pro</span><span class="ps">1170 × 2532</span>
                    </button>
                    <button class="preset-btn" data-w="1284" data-h="2778">
                        <span class="pn">Plus / Pro Max</span><span class="ps">1284 × 2778</span>
                    </button>
                    <button class="preset-btn" data-w="1080" data-h="2340">
                        <span class="pn">13 / mini</span><span class="ps">1080 × 2340</span>
                    </button>
                    <button class="preset-btn" data-w="828" data-h="1792">
                        <span class="pn">11 / XR</span><span class="ps">828 × 1792</span>
                    </button>
                </div>

                <div class="ctrl-label">Стиль</div>
                <div class="style-grid">
                    <button class="style-btn active" data-style="fill">Заполнение</button>
                    <button class="style-btn" data-style="tile">Мозаика</button>
                    <button class="style-btn" data-style="gradient">Градиент</button>
                </div>
            </div>

            <div class="ctrl-divider"></div>

            <div class="ctrl-label">Паттерн</div>
            <div class="tc-box" id="tcDisplay">—</div>
            <div class="palette-row" id="paletteRow"></div>
            <div class="clan-badge">Клан: <span class="clan-name" id="clanName">—</span></div>

            <div class="ctrl-divider"></div>

            <div id="patternExport">
                <div class="ctrl-slider">
                    <span class="slider-name">Размер</span>
                    <input type="range" id="size" min="256" max="2048" step="64" value="768">
                    <span class="slider-val" id="sizeLabel">768</span>
                </div>
            </div>
            <div id="wallpaperExport" style="display:none">
                <div class="wp-size-info" id="wpSizeInfo">1920 × 1080</div>
            </div>

            <div class="ctrl-actions">
                <button class="btn-gen" id="generateBtn">Создать</button>
                <button class="btn-rand" id="randomBtn">Случайный</button>
            </div>

        </aside>

        <section class="preview" id="previewArea">
            <div class="preview-inner">
                <div class="canvas-container" id="canvasContainer">
                    <canvas id="canvas"></canvas>
                    <div class="loader-overlay" id="loader">
                        <div class="spinner"></div>
                        <span>Ткём...</span>
                    </div>
                </div>
            </div>
            <div class="hist-strip" id="histStrip">
                <span class="hist-empty">История пуста</span>
            </div>
        </section>

    </main>

    <script src="js/data.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/parser.js"></script>
    <script src="js/generator.js"></script>
    <script src="js/renderer.js"></script>
    <script src="js/ui.js"></script>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js');
        }
    </script>

</body>

</html>
