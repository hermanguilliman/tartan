<body>

    <header class="topbar">
        <span class="logo">ТАРТАН</span>
        <nav class="mode-tabs" aria-label="Режим приложения">
            <button class="mode-tab active" data-mode="pattern">Узор</button>
            <button class="mode-tab" data-mode="wallpaper">Обои</button>
        </nav>
        <div class="topbar-spacer"></div>
        <button class="theme-toggle" id="themeToggle" aria-label="Переключить тему" title="Переключить тему">
            <span class="theme-icon-light" aria-hidden="true">○</span>
            <span class="theme-icon-dark" aria-hidden="true">●</span>
        </button>
        <button class="btn-download" id="downloadBtn">
            <span class="btn-dl-text">Скачать PNG</span>
            <span class="btn-dl-icon">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                    <polyline points="7 10 12 15 17 10"></polyline>
                    <line x1="12" y1="15" x2="12" y2="3"></line>
                </svg>
            </span>
        </button>
    </header>

    <main class="main">

        <aside class="sidebar" aria-label="Панель управления">

            
            <span class="ctrl-label">Цвет</span>
            <div class="ctrl-row">
                <select id="dominant">
                    <option value="any">Случайный</option>
                    <option value="B">Синий</option>
                    <option value="G">Зелёный</option>
                    <option value="K">Чёрный</option>
                    <option value="R">Красный</option>
                    <option value="T">Коричневый</option>
                    <option value="P">Фиолетовый</option>
                    <option value="Y">Жёлтый</option>
                    <option value="O">Оранжевый</option>
                    <option value="N">Серый</option>
                    <option value="W">Белый</option>
                    <option value="C">Малиновый</option>
                    <option value="M">Пурпурный</option>
                    <option value="E">Бирюзовый</option>
                    <option value="I">Индиго</option>
                    <option value="S">Сланцевый</option>
                </select>
                <div class="color-dot" id="colorDot"></div>
            </div>

            
            <span class="ctrl-label">Ткань</span>
            <label class="ctrl-check">
                <input type="checkbox" id="texture" checked>
                <span>Саржа 2/2</span>
            </label>
            <label class="ctrl-check">
                <input type="checkbox" id="warpweft">
                <span>Разные цвета основы и утка</span>
            </label>

            
            <div class="ctrl-row">
                <span class="ctrl-label-inline">Стиль нити</span>
                <select id="threadStyle">
                    <option value="classic">Классический</option>
                    <option value="flat">Плоский (Вектор)</option>
                    <option value="wool">Шерстяной (Мягкий)</option>
                    <option value="silk">Шёлковый (Глянец)</option>
                </select>
            </div>

            
            <div class="ctrl-slider">
                <span class="slider-name">Плотность</span>
                <input type="range" id="density" min="0.5" max="5" step="0.5" value="1">
                <span class="slider-val" id="densityLabel">1×</span>
            </div>

            
            <span class="ctrl-label">Тон</span>
            <select id="tone">
                <option value="any">Любой</option>
                <option value="dark">Тёмный</option>
                <option value="light">Светлый</option>
                <option value="historical">Исторический</option>
                <option value="modern">Современный</option>
            </select>

            <div class="section-divider"></div>

            
            <div id="patternControls">
                <span class="ctrl-label">Конструктор узора</span>
                <div id="stripBuilderList" class="strip-builder-list"></div>
                <button class="btn-ghost btn-add-strip" id="addStripBtn">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                    Добавить нить
                </button>

                <button class="btn-formula-toggle" id="toggleFormulaBtn">Формула Thread Count</button>
                <div id="formulaContainer" style="display: none; margin-top: 8px;">
                    <textarea id="tcInput" rows="2" placeholder="G/24 B4 K24 B4 G/24" spellcheck="false"></textarea>
                    <div class="tc-error" id="tcError">Ошибка разбора. Пример: G/24 B4 K24</div>
                    <button class="btn-secondary btn-sm" id="applyTC">Применить</button>
                    <div class="tc-hint">B G K R T P Y O N W C M E I S · D/L — префиксы · / — якорь</div>
                </div>
            </div>

            
            <div id="wallpaperControls" style="display:none">
                <span class="ctrl-label">Устройство</span>

                <span class="preset-group-label">PC</span>
                <div class="preset-grid">
                    <button class="preset-btn active" data-w="1920" data-h="1080">
                        <span class="pn">Full HD</span>
                        <span class="ps">1920 × 1080</span>
                    </button>
                    <button class="preset-btn" data-w="1920" data-h="1200">
                        <span class="pn">WUXGA</span>
                        <span class="ps">1920 × 1200</span>
                    </button>
                    <button class="preset-btn" data-w="2560" data-h="1440">
                        <span class="pn">QHD</span>
                        <span class="ps">2560 × 1440</span>
                    </button>
                    <button class="preset-btn" data-w="3840" data-h="2160">
                        <span class="pn">4K UHD</span>
                        <span class="ps">3840 × 2160</span>
                    </button>
                    <button class="preset-btn" data-w="3440" data-h="1440">
                        <span class="pn">Ultrawide</span>
                        <span class="ps">3440 × 1440</span>
                    </button>
                    <button class="preset-btn" data-w="2560" data-h="1080">
                        <span class="pn">UW Full HD</span>
                        <span class="ps">2560 × 1080</span>
                    </button>
                    <button class="preset-btn" data-w="1366" data-h="768">
                        <span class="pn">HD Laptop</span>
                        <span class="ps">1366 × 768</span>
                    </button>
                </div>

                <span class="preset-group-label">Android</span>
                <div class="preset-grid">
                    <button class="preset-btn" data-w="1080" data-h="2400">
                        <span class="pn">Standard</span>
                        <span class="ps">1080 × 2400</span>
                    </button>
                    <button class="preset-btn" data-w="1440" data-h="3200">
                        <span class="pn">QHD+</span>
                        <span class="ps">1440 × 3200</span>
                    </button>
                    <button class="preset-btn" data-w="1080" data-h="2340">
                        <span class="pn">Pixel / Samsung</span>
                        <span class="ps">1080 × 2340</span>
                    </button>
                    <button class="preset-btn" data-w="720" data-h="1600">
                        <span class="pn">Budget</span>
                        <span class="ps">720 × 1600</span>
                    </button>
                </div>

                <span class="preset-group-label">iOS</span>
                <div class="preset-grid">
                    <button class="preset-btn" data-w="1179" data-h="2556">
                        <span class="pn">iPhone 15 / 16</span>
                        <span class="ps">1179 × 2556</span>
                    </button>
                    <button class="preset-btn" data-w="1290" data-h="2796">
                        <span class="pn">Pro Max</span>
                        <span class="ps">1290 × 2796</span>
                    </button>
                    <button class="preset-btn" data-w="1170" data-h="2532">
                        <span class="pn">14 / 13 Pro</span>
                        <span class="ps">1170 × 2532</span>
                    </button>
                    <button class="preset-btn" data-w="1284" data-h="2778">
                        <span class="pn">Plus / Pro Max</span>
                        <span class="ps">1284 × 2778</span>
                    </button>
                    <button class="preset-btn" data-w="1080" data-h="2340">
                        <span class="pn">13 / mini</span>
                        <span class="ps">1080 × 2340</span>
                    </button>
                    <button class="preset-btn" data-w="828" data-h="1792">
                        <span class="pn">11 / XR</span>
                        <span class="ps">828 × 1792</span>
                    </button>
                </div>

                <span class="ctrl-label">Стиль</span>
                <div class="style-grid">
                    <button class="style-btn active" data-style="fill">Заливка</button>
                    <button class="style-btn" data-style="tile">Мозаика</button>
                    <button class="style-btn" data-style="gradient">Градиент</button>
                </div>

                <div class="ctrl-slider">
                    <span class="slider-name">Виньетка</span>
                    <input type="range" id="vignette" min="0" max="1" step="0.1" value="0.4">
                    <span class="slider-val" id="vignetteLabel">40%</span>
                </div>
            </div>

            <div class="section-divider"></div>

            
            <span class="ctrl-label">Паттерн</span>
            <div class="tc-box" id="tcDisplay">—</div>
            <div class="palette-row" id="paletteRow"></div>
            <div class="clan-badge">Клан&nbsp;<span class="clan-name" id="clanName">—</span></div>

            <div class="section-divider"></div>

            
            <div id="patternExport">
                <span class="ctrl-label">Размер узора</span>
                <div class="ctrl-slider">
                    <input type="range" id="size" min="256" max="2048" step="64" value="768">
                    <span class="slider-val" id="sizeLabel">768</span>px
                </div>
            </div>
            <div id="wallpaperExport" style="display:none">
                <div class="wp-size-info" id="wpSizeInfo">1920 × 1080</div>
            </div>

        </aside>

        <section class="preview" id="previewArea">
            <div class="preview-inner">
                <div class="canvas-container" id="canvasContainer">
                    <canvas id="canvas"></canvas>
                    <div class="loader-overlay" id="loader">
                        <div class="loader-segments" aria-hidden="true">
                            <span></span><span></span><span></span>
                        </div>
                        <span class="loader-text">[ЗАГРУЗКА]</span>
                    </div>
                </div>
            </div>
            <div class="preview-actions">
                <button class="btn-primary" id="generateBtn">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
                    </svg>
                    Создать
                </button>
                <button class="btn-secondary" id="randomBtn">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2"></path>
                    </svg>
                    Случайный
                </button>
            </div>

            <div class="hist-strip" id="histStrip">
                <span class="hist-empty">История пуста</span>
            </div>
        </section>

    </main>

    <div class="popover-backdrop" id="popoverBackdrop"></div>

    <script src="js/data.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/parser.js"></script>
    <script src="js/generator.js"></script>
    <script src="js/renderer.js"></script>
    <script src="js/ui.js"></script>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js');
        }
    </script>
