<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tartan Generator</title>

<style>
:root {
    --bg: #0a0c12;
    --panel: #12151f;
    --panel2: #1a1f2e;
    --accent: #00f5ff;
    --accent-dark: #00b8c2;
    --text: #e0e7ff;
    --text-muted: #a0a8c0;
    --border: #2a3142;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px 15px;
}

header {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -0.5px;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 12px;
    color: var(--accent);
    text-shadow: 0 0 20px rgba(0, 245, 255, 0.3);
}

.subtitle {
    font-size: 15px;
    color: var(--text-muted);
    margin-bottom: 30px;
    text-align: center;
    max-width: 420px;
}

.container {
    width: 100%;
    max-width: 1280px;
    display: grid;
    grid-template-columns: 1fr;
    gap: 24px;
}

@media (min-width: 960px) {
    .container {
        grid-template-columns: 380px 1fr;
    }
}

.panel {
    background: var(--panel);
    border-radius: 20px;
    padding: 28px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    border: 1px solid var(--border);
    transition: all 0.3s ease;
}

.panel:hover {
    box-shadow: 0 15px 40px rgba(0, 245, 255, 0.08);
}

.controls {
    display: flex;
    flex-direction: column;
    gap: 22px;
}

.control-group {
    display: flex;
    flex-direction: column;
    gap: 8px;
}

label {
    font-size: 14px;
    font-weight: 500;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    gap: 8px;
}

input[type="checkbox"] {
    accent-color: var(--accent);
    width: 18px;
    height: 18px;
}

select, input[type="range"] {
    background: var(--panel2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 12px;
    border-radius: 12px;
    font-size: 15px;
    transition: all 0.2s ease;
    width: 100%;
}

select:focus, input[type="range"]:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(0, 245, 255, 0.15);
}

.color-preview {
    width: 32px;
    height: 32px;
    border-radius: 10px;
    border: 2px solid var(--border);
    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    margin-left: auto;
    flex-shrink: 0;
    transition: background 0.3s;
}

.slider-container {
    display: flex;
    align-items: center;
    gap: 12px;
}

.slider-value {
    font-family: monospace;
    font-size: 15px;
    min-width: 48px;
    text-align: right;
    color: var(--accent);
    font-weight: 600;
}

button {
    padding: 14px 20px;
    border: none;
    border-radius: 14px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.25s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
}

button:hover {
    transform: translateY(-2px);
}

.generate {
    background: linear-gradient(135deg, var(--accent), #00b8c2);
    color: #000;
    font-size: 17px;
}

.random {
    background: #ff2e94;
    color: white;
}

.download {
    background: #22c55e;
    color: white;
}

.canvas-panel {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--panel2);
    padding: 20px;
    border-radius: 20px;
}

canvas {
    width: 100%;
    max-width: 620px;
    height: auto;
    aspect-ratio: 1 / 1;
    border-radius: 16px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6),
                0 0 0 1px rgba(255,255,255,0.05) inset;
    background: #000;
    image-rendering: crisp-edges;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
}

.panel {
    animation: fadeIn 0.6s ease backwards;
}
</style>
</head>

<body>

<header>🎨 Генератор тартана</header>
<p class="subtitle">Создавай уникальные шотландские узоры за секунды</p>

<div class="container">

    <div class="panel">
        <div class="controls">

            <div class="control-group">
                <label>Доминирующий цвет</label>
                <div style="display:flex; align-items:center; gap:12px;">
                    <select id="dominant">
                        <option value="any">Случайный</option>
                        <option value="red">Красный</option>
                        <option value="green">Зелёный</option>
                        <option value="blue">Синий</option>
                        <option value="purple">Фиолетовый</option>
                        <option value="yellow">Жёлтый</option>
                    </select>
                    <div id="colorPreview" class="color-preview"></div>
                </div>
            </div>

            <div class="control-group">
                <label>Тон</label>
                <select id="tone">
                    <option value="any">Любой</option>
                    <option value="dark">Тёмный</option>
                    <option value="pastel">Пастельный</option>
                </select>
            </div>

            <div class="control-group">
                <label><input type="checkbox" id="historical" checked> Исторический стиль (приглушённые тона)</label>
            </div>

            <div class="control-group">
                <label><input type="checkbox" id="texture" checked> Текстура ткани (эффект переплетения)</label>
            </div>

            <div class="control-group">
                <label for="size">Размер холста</label>
                <div class="slider-container">
                    <input type="range" id="size" min="256" max="2048" step="64" value="512">
                    <span class="slider-value" id="sizeLabel">512</span>
                </div>
            </div>

            <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:12px;">
                <button class="generate" id="generateBtn">✨ Сгенерировать</button>
                <button class="random" id="randomBtn">🎲 Случайный</button>
            </div>

            <button class="download" id="downloadBtn" style="width:100%; margin-top:8px;">💾 Скачать PNG</button>

        </div>
    </div>

    <div class="panel canvas-panel">
        <canvas id="canvas"></canvas>
    </div>

</div>

<script>
const DOMINANT_HUES = {
    red: [0.0, 0.05],
    green: [0.25, 0.4],
    blue: [0.55, 0.7],
    purple: [0.75, 0.85],
    yellow: [0.12, 0.18]
};

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const dominantEl = document.getElementById("dominant");
const toneEl = document.getElementById("tone");
const historicalEl = document.getElementById("historical");
const textureEl = document.getElementById("texture");
const sizeEl = document.getElementById("size");
const sizeLabel = document.getElementById("sizeLabel");

// Текущее состояние паттерна
let currentSett = null;
let currentSize = 512;

function rand(a, b) { return Math.random() * (b - a) + a; }

function hsvToRgb(h, s, v) {
    let r, g, b, i = Math.floor(h * 6), f = h * 6 - i;
    let p = v * (1 - s), q = v * (1 - f * s), t = v * (1 - (1 - f) * s);
    switch (i % 6) {
        case 0: r = v; g = t; b = p; break;
        case 1: r = q; g = v; b = p; break;
        case 2: r = p; g = v; b = t; break;
        case 3: r = p; g = q; b = v; break;
        case 4: r = t; g = p; b = v; break;
        case 5: r = v; g = p; b = q; break;
    }
    return [r * 255, g * 255, b * 255];
}

function generateBase() {
    let dominant = dominantEl.value;
    let tone = toneEl.value;
    let historical = historicalEl.checked;

    let h = dominant === "any" ? Math.random() : rand(...DOMINANT_HUES[dominant]);
    let s, v;
    if (tone === "dark")        { s = rand(0.5, 0.9); v = rand(0.3, 0.6); }
    else if (tone === "pastel") { s = rand(0.2, 0.4); v = rand(0.8, 1);   }
    else                        { s = rand(0.4, 0.9); v = rand(0.4, 0.9); }

    if (historical) { s *= 0.72; v *= 0.82; }

    const rgb = hsvToRgb(h, s, v);
    document.getElementById("colorPreview").style.background =
        `rgb(${rgb[0]|0},${rgb[1]|0},${rgb[2]|0})`;
    return rgb;
}

function accent(historical) {
    if (historical) {
        return [[28,28,32],[235,235,240],[110,110,115]][Math.floor(Math.random()*3)];
    }
    return Math.random() > 0.5 ? [0,0,0] : [255,255,255];
}

function buildSett(base, historical) {
    return [
        [base,            Math.floor(rand(60, 140))],
        [accent(historical), Math.floor(rand(8, 30))],
        [base,            Math.floor(rand(20, 60))],
        [accent(historical), Math.floor(rand(4, 12))],
        [base,            Math.floor(rand(20, 60))],
        [accent(historical), Math.floor(rand(8, 24))],
        [base,            Math.floor(rand(40, 100))]
    ];
}

// Рисует паттерн из готового sett — не генерирует новый
function drawPattern(size, sett, useTexture) {
    canvas.width = size;
    canvas.height = size;

    let pattern = [];
    sett.forEach(([c, w]) => {
        for (let i = 0; i < w; i++) pattern.push(c);
    });
    pattern = pattern.concat(pattern.slice().reverse());
    const plen = pattern.length;

    const img = ctx.createImageData(size, size);
    const data = img.data;

    for (let x = 0; x < size; x++) {
        for (let y = 0; y < size; y++) {
            const cx = pattern[x % plen];
            const cy = pattern[y % plen];

            let r, g, b;
            if (cx[0] === cy[0] && cx[1] === cy[1] && cx[2] === cy[2]) {
                [r, g, b] = cx;
            } else {
                r = Math.min(255, cx[0] * 0.62 + cy[0] * 0.62);
                g = Math.min(255, cx[1] * 0.62 + cy[1] * 0.62);
                b = Math.min(255, cx[2] * 0.62 + cy[2] * 0.62);
            }

            if (useTexture) {
                const weave = ((x % 4 < 2) ^ (y % 4 < 2)) ? 12 : -12;
                const noise = rand(-9, 9);
                r = Math.max(0, Math.min(255, r + weave + noise));
                g = Math.max(0, Math.min(255, g + weave + noise));
                b = Math.max(0, Math.min(255, b + weave + noise));
            }

            const i = (y * size + x) * 4;
            data[i] = r; data[i+1] = g; data[i+2] = b; data[i+3] = 255;
        }
    }

    ctx.putImageData(img, 0, 0);
}

// Полная генерация — новый паттерн
function generate() {
    currentSize = parseInt(sizeEl.value);
    sizeLabel.textContent = currentSize;
    const base = generateBase();
    currentSett = buildSett(base, historicalEl.checked);
    drawPattern(currentSize, currentSett, textureEl.checked);
}

// Только текстура — паттерн тот же
textureEl.addEventListener("change", () => {
    if (!currentSett) return;
    drawPattern(currentSize, currentSett, textureEl.checked);
});

// Только размер — паттерн тот же
sizeEl.addEventListener("input", () => {
    currentSize = parseInt(sizeEl.value);
    sizeLabel.textContent = currentSize;
    if (!currentSett) return;
    drawPattern(currentSize, currentSett, textureEl.checked);
});

// Цвет и тон — новый паттерн
dominantEl.addEventListener("change", generate);
toneEl.addEventListener("change", generate);
historicalEl.addEventListener("change", generate);

document.getElementById("generateBtn").addEventListener("click", generate);

document.getElementById("randomBtn").addEventListener("click", () => {
    const selects = document.querySelectorAll("select");
    selects.forEach(s => s.selectedIndex = Math.floor(Math.random() * s.options.length));
    historicalEl.checked = Math.random() > 0.4;
    textureEl.checked = Math.random() > 0.3;
    generate();
});

document.getElementById("downloadBtn").addEventListener("click", () => {
    const link = document.createElement("a");
    link.download = `tartan_${Date.now()}.png`;
    link.href = canvas.toDataURL("image/png");
    link.click();
});

generate();
</script>

</body>
</html>
